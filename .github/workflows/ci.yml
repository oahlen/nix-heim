name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            heim/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('heim/Cargo.lock') }}

      - name: Check formatting
        run: nix-shell --run "cargo fmt --manifest-path heim/Cargo.toml --check"

      - name: Lint
        run: nix-shell --run "cargo clippy --manifest-path heim/Cargo.toml -- -D warnings"

      - name: Build
        run: nix-shell --run "just rust-build"

      - name: Test
        run: nix-shell --run "just rust-test"

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: Format check
        run: nix-shell --run "treefmt --ci"

      - name: Lint
        run: nix-shell --run "just nix-lint"

      - name: Build and verify test manifest
        run: nix-shell --run "just nix-test-manifest"

      - name: Build standalone test module
        run: nix-shell --run "just nix-test-standalone"
